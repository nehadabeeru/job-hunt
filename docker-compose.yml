services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: jobradar
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://jobradar:jobradar@db:5432/jobradar
      ENABLE_POLLING: "true"
      # See .env.example for all knobs (poll intervals, SMTP, concurrency…)
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
